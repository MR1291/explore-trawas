<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background (matches rounded-xl) -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>
  <!-- Lucide Mountain icon: main peak -->
  <polyline points="5,24 16,7 27,24" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Lucide Mountain icon: smaller left peak -->
  <polyline points="2,24 10,15 18,24" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
</svg>